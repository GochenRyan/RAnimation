[paths]
maya_batch=D:\Autodesk\Maya2026\bin\mayabatch.exe
; UAL1 provides the model (male Mannequin) and its takes; UAL2 takes join the same asset (same 65-joint rig).
; Non-RM files on purpose: the runtime does not consume root motion yet (see the design doc, §2.4).
fbx_path=S:\AnimAssets\UAL\Universal Animation Library[Source]\Unity\UAL1.fbx
extra_fbx_paths=S:\AnimAssets\UAL\Universal Animation Library 2[Source]\Unity\UAL2.fbx
output_dir=S:\Github\RAnimation\Assets\SkeletalAnimControls\ual_mannequin
asset_name=UAL_Mannequin

; Optional. Empty means auto detect.
root_joint=
mesh_root=

; Optional. Use this only when FBX has one long timeline and clips are from external json.
clips_json=
; Optional. Regular expression; only takes whose name matches are exported.
take_filter=

[options]
clean_anim=true
preview=false
keep_intermediate_full_model=false
reference_example=false
